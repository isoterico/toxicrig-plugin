# Builds ToxicRig for Windows (VST3 + Standalone) and macOS (VST3 + AU + Standalone,
# Universal: Apple Silicon + Intel), runs the offline tests and pluginval,
# and publishes everything as downloadable "artifacts" on the run page.
name: Build ToxicRig

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release --target ToxicRig_VST3 ToxicRig_Standalone --parallel 4

      - name: Build AU (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target ToxicRig_AU --parallel 4

      - name: Build and run offline tests
        shell: bash
        run: |
          cmake --build build --config Release --target ToxicRigTests --parallel 4
          exe=$(find build -name "ToxicRigTests" -type f -perm -u+x 2>/dev/null | head -1)
          [ -z "$exe" ] && exe=$(find build -name "ToxicRigTests.exe" | head -1)
          "$exe" test-out || echo "::warning::Some offline tests failed - see report.txt"

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist
          vst3=$(find build -type d -name "ToxicRig.vst3" | head -1)
          cp -R "$vst3" dist/
          if [ "$RUNNER_OS" == "macOS" ]; then
            au=$(find build -type d -name "ToxicRig.component" | head -1)
            app=$(find build -type d -name "ToxicRig.app" | head -1)
            cp -R "$au" dist/
            cp -R "$app" dist/
            # Ad-hoc signature: required for Apple Silicon to load the plugin at all.
            for b in dist/*.vst3 dist/*.component dist/*.app; do codesign --force --deep -s - "$b"; done
          else
            exe=$(find build -name "ToxicRig.exe" | head -1)
            cp "$exe" dist/
          fi

      - name: Validate with pluginval
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests dist/ToxicRig.vst3 | tee pluginval.txt || echo "::warning::pluginval reported problems"
          else
            curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pv.zip
            ./pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests dist/ToxicRig.vst3 | tee pluginval.txt || echo "::warning::pluginval reported problems"
          fi
          cp pluginval.txt dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ToxicRig-${{ matrix.name }}
          path: dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestReport-${{ matrix.name }}
          path: test-out
