<h2 style="color:#2fbf10">ToxicRig</h2>
<p>Simulatore di ampli valvolare con pedaliera, casse e microfoni.</p>
<p>Verranno installati:</p>
<ul><li>Plugin VST3 in <code>/Library/Audio/Plug-Ins/VST3</code></li>
<li>Plugin Audio Unit in <code>/Library/Audio/Plug-Ins/Components</code></li>
<li>App standalone in <code>/Applications</code></li></ul>
<p>Con "Personalizza" puoi scegliere cosa installare.</p>
</body></html>
